<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Introduccion ventas</title>
<style>
  *{box-sizing:border-box}
  /* El fondo se desplaza despacio para que la placa no parezca congelada. */
  body{margin:0;height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#241f27,#432b45);background-size:170% 170%;color:#fff;font-family:'Segoe UI',sans-serif;animation:fondo 9s ease-in-out both}
  @keyframes fondo{0%{background-position:0% 50%}100%{background-position:100% 50%}}
  .card{text-align:center;max-width:900px;padding:40px;animation:entrada 9s ease-out both}
  @keyframes entrada{0%{transform:scale(.94) translateY(18px);opacity:.45}22%{transform:scale(1.02) translateY(0);opacity:1}100%{transform:scale(1.06) translateY(-8px);opacity:1}}
  .eyebrow{font-size:13px;letter-spacing:.24em;color:#e0b0e2;text-transform:uppercase}
  h1{font-size:56px;line-height:1.08;margin:18px 0 14px}
  .marca{color:#d47ad4}
  p{font-size:21px;color:#ded3df;line-height:1.55}
  hr{width:100px;height:4px;background:#c25cc8;border:0;margin:30px auto}
  .pie{margin-top:34px;font-size:14px;color:#b3a7b5}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">MEZI Propiedades</div>
    <h1>Gestión de<br><span class="marca">Reparaciones</span></h1>
    <hr>
    <p>Una plataforma para dejar atrás las planillas y los mensajes sueltos.<br>Cada reclamo, proveedor y visita, en un solo lugar.</p>
    <div class="pie">Demostración comercial · Reclamos · Proveedores · Calendario</div>
  </div>
</body>
</html>
